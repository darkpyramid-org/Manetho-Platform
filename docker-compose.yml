# ──────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT ONLY
# Credentials below (manetho/manetho, minioadmin, open Redis) are
# intentionally weak for convenience. NEVER reuse them on shared,
# staging, or production hosts. Prefer env overrides:
#   POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD, REDIS_PASSWORD
# ──────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: manetho-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manetho}
      # LOCAL ONLY — override with a strong secret outside local machines
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manetho}
      POSTGRES_DB: ${POSTGRES_DB:-manetho}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-manetho}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: manetho-redis
    # LOCAL ONLY — no password by default. Set REDIS_PASSWORD for shared hosts.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: MinIO as a local S3-compatible object store
  minio:
    image: minio/minio:latest
    container_name: manetho-minio
    command: server /data --console-address ':9001'
    environment:
      # LOCAL ONLY — minioadmin/minioadmin must not be used outside local
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
